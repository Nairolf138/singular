name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install lint dependencies
        run: |
          python -m pip install --upgrade pip
          pip install '.[test]'
      - name: Ruff
        run: ruff check .
      - name: Black
        run: black --check --target-version py310 --fast .
      - name: Deployment manifests
        run: python scripts/check_deployment_manifests.py

  typecheck:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install typecheck dependencies
        run: |
          python -m pip install --upgrade pip
          pip install '.[test]'
      - name: Mypy
        run: mypy src

  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install '.[test]'
      - name: Pytest with global coverage guardrail
        run: pytest -m "not integration" --cov=src/singular --cov-fail-under=85 --cov-report=term-missing --cov-report=xml:coverage.xml
      - name: Validate critical modules coverage >= 90%
        run: |
          python scripts/check_coverage_thresholds.py \
            --coverage-xml coverage.xml \
            --threshold src/singular/cli.py=90 \
            --threshold src/singular/lives.py=90

  optional-integrations:
    name: optional integration (${{ matrix.integration }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - integration: dashboard
            extra: dashboard
            tests: tests/test_dashboard.py tests/test_dashboard_smoke_e2e.py
          - integration: openai-provider
            extra: llm-openai
            tests: tests/providers/test_llm_openai.py
          - integration: local-llm-provider
            extra: llm-local
            tests: tests/providers/test_llm_local.py
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install optional integration dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ".[test,${{ matrix.extra }}]"
      - name: Run optional integration contract
        run: pytest -q ${{ matrix.tests }}

  sandbox-oci:
    name: OCI sandbox (Docker + seccomp)
    runs-on: ubuntu-latest
    env:
      SINGULAR_SANDBOX_RUNTIME: docker
      SINGULAR_SANDBOX_IMAGE: python:3.11-alpine
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install '.[test,sandbox]'
      - name: Verify Docker and seccomp
        run: |
          command -v docker || { echo "OCI sandbox unavailable: docker runtime is missing"; exit 1; }
          security_options="$(docker info --format '{{json .SecurityOptions}}')" || {
            echo "OCI sandbox unavailable: docker daemon probe failed"
            exit 1
          }
          echo "$security_options"
          grep -qi seccomp <<<"$security_options" || {
            echo "OCI sandbox unavailable: docker does not report active seccomp support"
            exit 1
          }
      - name: Prepare configured sandbox image
        run: |
          echo "Preparing SINGULAR_SANDBOX_IMAGE=$SINGULAR_SANDBOX_IMAGE"
          docker pull "$SINGULAR_SANDBOX_IMAGE" || {
            echo "OCI sandbox unavailable: failed to prepare $SINGULAR_SANDBOX_IMAGE"
            exit 1
          }
          docker image inspect "$SINGULAR_SANDBOX_IMAGE" >/dev/null || {
            echo "OCI sandbox unavailable: $SINGULAR_SANDBOX_IMAGE is not present locally"
            exit 1
          }
      - name: Run OCI sandbox tests only
        run: pytest -q -m sandbox_oci

  build:
    name: build
    runs-on: ubuntu-latest
    needs: [lint, typecheck, tests, optional-integrations, sandbox-oci]
    if: ${{ always() }}
    steps:
      - name: Fail when dependencies failed
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: |
          echo "Upstream CI job failed or was cancelled."
          exit 1
      - name: CI summary
        run: echo "lint/typecheck/tests/optional-integrations/sandbox-oci completed successfully."
