name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install lint dependencies
        run: |
          python -m pip install --upgrade pip
          pip install '.[test]'
      - name: Ruff
        run: ruff check .
      - name: Black
        run: black --check --target-version py310 --fast .
      - name: Deployment manifests
        run: python scripts/check_deployment_manifests.py

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          # Mypy validates the declared minimum; runtime compatibility remains
          # covered by the test and lint matrices.
          python-version: "3.10"
      - name: Install typecheck dependencies
        run: |
          python -m pip install --upgrade pip
          pip install '.[test]'
      - name: Mypy
        run: mypy src

  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install '.[test]'
      - name: Collect mandatory tests
        run: pytest --collect-only -m "not integration"
      # pytest.ini promotes DeprecationWarning to errors (with only narrowly
      # scoped compatibility exclusions). Keep this pass separate so collection,
      # deprecations, and coverage failures have distinct log annotations.
      - name: Pytest with deprecations as errors
        run: pytest -m "not integration"
      - name: Pytest with global coverage guardrails
        run: pytest -m "not integration" -W default::DeprecationWarning --cov=src/singular --cov-fail-under=85 --cov-report=term-missing --cov-report=xml:coverage.xml
      - name: Validate critical modules coverage >= 90%
        run: |
          python scripts/check_coverage_thresholds.py \
            --coverage-xml coverage.xml \
            --threshold src/singular/cli.py=90 \
            --threshold src/singular/lives.py=90

  optional-integrations:
    name: optional integration (${{ matrix.integration }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - integration: dashboard
            extra: dashboard
            tests: tests/test_dashboard.py tests/test_dashboard_smoke_e2e.py
            fastapi-mode: real
          - integration: openai-provider
            extra: llm-openai
            tests: tests/providers/test_llm_openai.py
            fastapi-mode: stub
          - integration: local-llm-provider
            extra: llm-local
            tests: tests/providers/test_llm_local.py
            fastapi-mode: stub
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install optional integration dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ".[test,${{ matrix.extra }}]"
      - name: Verify installed dashboard metadata and TestClient dependencies
        if: matrix.integration == 'dashboard'
        env:
          SINGULAR_TEST_FASTAPI: ${{ matrix.fastapi-mode }}
        run: |
          python - <<'PY'
          from importlib.metadata import requires
          from pathlib import Path

          import fastapi
          import httpx
          from fastapi import FastAPI
          from fastapi.testclient import TestClient

          dashboard_requirements = [
              requirement
              for requirement in requires("singular") or []
              if 'extra == "dashboard"' in requirement
          ]
          if not any(requirement.lower().startswith("httpx") for requirement in dashboard_requirements):
              raise SystemExit("installed dashboard extra metadata does not declare httpx")

          module_path = Path(fastapi.__file__).resolve()
          stub_path = (Path.cwd() / "tests" / "fastapi_stub").resolve()
          print(f"fastapi loaded from: {module_path}")
          print(f"httpx loaded from: {Path(httpx.__file__).resolve()}")
          if module_path == stub_path or stub_path in module_path.parents:
              raise SystemExit("dashboard integration loaded tests/fastapi_stub")

          client = TestClient(FastAPI())
          client.close()
          PY
      - name: Run optional integration contract
        env:
          SINGULAR_TEST_FASTAPI: ${{ matrix.fastapi-mode }}
        run: pytest -q ${{ matrix.tests }}

  sandbox-oci:
    name: OCI sandbox (Docker + seccomp)
    runs-on: ubuntu-latest
    env:
      SINGULAR_SANDBOX_RUNTIME: docker
      SINGULAR_SANDBOX_IMAGE: python:3.11-alpine
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install '.[test,sandbox]'
      - name: Verify Docker and seccomp
        run: |
          command -v docker || { echo "OCI sandbox unavailable: docker runtime is missing"; exit 1; }
          security_options="$(docker info --format '{{json .SecurityOptions}}')" || {
            echo "OCI sandbox unavailable: docker daemon probe failed"
            exit 1
          }
          echo "$security_options"
          grep -qi seccomp <<<"$security_options" || {
            echo "OCI sandbox unavailable: docker does not report active seccomp support"
            exit 1
          }
      - name: Prepare configured sandbox image
        run: |
          echo "Preparing SINGULAR_SANDBOX_IMAGE=$SINGULAR_SANDBOX_IMAGE"
          docker pull "$SINGULAR_SANDBOX_IMAGE" || {
            echo "OCI sandbox unavailable: failed to prepare $SINGULAR_SANDBOX_IMAGE"
            exit 1
          }
          docker image inspect "$SINGULAR_SANDBOX_IMAGE" >/dev/null || {
            echo "OCI sandbox unavailable: $SINGULAR_SANDBOX_IMAGE is not present locally"
            exit 1
          }
      - name: Run OCI sandbox tests only
        run: pytest -q -m sandbox_oci

  build:
    name: Build distributions
    runs-on: ubuntu-latest
    needs: [lint, typecheck, tests, optional-integrations, sandbox-oci]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build tooling
        run: python -m pip install --upgrade build
      - name: Build source and wheel distributions
        run: python -m build
      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: distributions
          path: dist/

  ci-summary:
    name: CI summary
    runs-on: ubuntu-latest
    needs: [lint, typecheck, tests, optional-integrations, sandbox-oci, build]
    if: ${{ always() }}
    steps:
      - name: Write job results
        env:
          NEEDS_RESULTS: ${{ toJSON(needs) }}
        run: |
          {
            echo "## CI job results"
            echo
            echo '```json'
            echo "$NEEDS_RESULTS"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
