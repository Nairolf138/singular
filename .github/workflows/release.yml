name: Release v0.1.0

on:
  pull_request:
  push:
    tags:
      - v0.1.0

permissions:
  contents: read

jobs:
  stable-cli:
    name: Stable CLI (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install release test dependencies
        run: python -m pip install '.[test]' build
      - name: Check release surface
        run: |
          pytest -q \
            tests/test_cli_lives.py tests/test_lives.py \
            tests/test_birth_starter_profiles.py tests/test_living_starter_integration.py \
            tests/test_talk.py tests/test_report.py \
            tests/test_cli_doctor.py tests/providers/test_provider_doctor.py \
            tests/test_cli_retention.py tests/test_retention.py \
            tests/test_wheel_distribution.py

  distributions:
    name: Build and install both distributions
    if: github.ref == 'refs/tags/v0.1.0'
    needs: stable-cli
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify tag is on main and matches package version
        run: |
          git fetch origin main
          git merge-base --is-ancestor HEAD origin/main
          python - <<'PY'
          import tomllib
          from pathlib import Path

          assert tomllib.loads(Path('pyproject.toml').read_text())['project']['version'] == '0.1.0'
          PY
      - name: Build clean source and wheel distributions
        run: |
          python -m pip install build
          python -m build
      - name: Install and exercise the wheel outside checkout
        run: |
          python -m venv "$RUNNER_TEMP/wheel-venv"
          "$RUNNER_TEMP/wheel-venv/bin/python" -m pip install dist/singular-0.1.0-py3-none-any.whl
          cd "$RUNNER_TEMP"
          export SINGULAR_ROOT="$RUNNER_TEMP/wheel-registry"
          wheel-venv/bin/singular lives create --name Lumen --starter-profile assistant
          wheel-venv/bin/singular lives use lumen
          wheel-venv/bin/singular status --format table
          wheel-venv/bin/singular talk --prompt Bonjour
          wheel-venv/bin/singular doctor
          wheel-venv/bin/singular retention run --dry-run
      - name: Install and exercise the sdist outside checkout
        run: |
          python -m venv "$RUNNER_TEMP/sdist-venv"
          "$RUNNER_TEMP/sdist-venv/bin/python" -m pip install "$GITHUB_WORKSPACE/dist/singular-0.1.0.tar.gz"
          cd "$RUNNER_TEMP"
          export SINGULAR_ROOT="$RUNNER_TEMP/sdist-registry"
          sdist-venv/bin/singular lives create --name Source --starter-profile assistant
          sdist-venv/bin/singular lives use source
          sdist-venv/bin/singular status --format table
      - name: Record SHA-256 checksums
        run: cd dist && sha256sum singular-0.1.0-py3-none-any.whl singular-0.1.0.tar.gz > ../SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: release-distributions
          path: |
            dist/singular-0.1.0-py3-none-any.whl
            dist/singular-0.1.0.tar.gz
            SHA256SUMS

  publish:
    name: Publish GitHub Release
    needs: distributions
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: release-distributions
      - name: Verify downloaded assets
        run: sha256sum -c SHA256SUMS
      - name: Publish version and assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            dist/singular-0.1.0-py3-none-any.whl \
            dist/singular-0.1.0.tar.gz SHA256SUMS \
            --verify-tag --title 'Singular v0.1.0' \
            --notes-file docs/releases/v0.1.0.md
