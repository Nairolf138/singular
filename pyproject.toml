[project]
name = "singular"
version = "0.1.0"
description = "Singular project"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Singular Contributors" }]
dependencies = [
    # Runtime policy: explicit lower bounds + conservative upper bounds.
    "requests>=2.31,<3",
]

[project.optional-dependencies]
# Optional dependency policy mirrors runtime constraints:
# - pin minimum known-compatible versions
# - keep major-version upper caps for safer updates
# The mandatory unit-test/quality suite deliberately has no optional runtime
# integration dependencies.  Install it with ``.[test]``.
test = [
    "pytest>=8.2,<9",
    "pytest-cov>=5,<7",
    "ruff>=0.4,<1",
    "black>=24.4,<26",
    "mypy>=1.10,<2",
]
yaml = ["pyyaml>=6.0,<7"]
dashboard = [
    "fastapi>=0.110,<1",
    # Starlette 0.36.x (allowed by FastAPI 0.110) is incompatible with httpx
    # 0.28+, while newer allowed Starlette releases support httpx 0.27.
    "httpx>=0.27,<0.28",
    "uvicorn>=0.29,<1",
    "websockets>=12,<16",
]
# Opt-in because Playwright also requires ``playwright install chromium``.
dashboard-e2e = ["playwright>=1.46,<2"]
viz = ["matplotlib>=3.8,<4"]
# LLM clients are isolated from the mandatory test extra because they can pull
# large model stacks or require external credentials/services.
llm-openai = ["openai>=1.30,<3"]
llm-local = ["transformers>=4.41,<6"]
# rclpy is supplied by a sourced ROS2 distribution rather than by the standard
# Python test environment.  The version range documents the supported API.
ros2 = ["rclpy>=3.3,<4"]
gpio = ["gpiozero>=2.0,<3"]
# The secure sandbox has no Python dependency: it requires a compatible
# Podman or Docker executable on the host.
sandbox = []

[project.scripts]
singular = "singular.cli:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"singular.data" = ["configs/*.yaml", "configs/ecosystem/*.json"]
"singular.dashboard" = ["templates/*.html", "static/*"]

[tool.black]
target-version = ["py310"]
extend-exclude = '''
(
  ^/src/graine/target/tests/test_evaluate\.py
| ^/src/graine/target/tests/test_reduce_sum\.py
| ^/src/singular/__main__\.py
| ^/src/singular/life/reproduction\.py
| ^/tests/test_mutation_absurde\.py
)
'''

[tool.ruff]
target-version = "py310"
extend-exclude = [
    # Generated/fixture sources whose deliberately unusual formatting is part
    # of the mutation and reducer test data rather than production Python.
    "src/graine/target/tests/test_evaluate.py",
    "src/graine/target/tests/test_reduce_sum.py",
    "src/singular/__main__.py",
    "src/singular/life/reproduction.py",
    "tests/test_mutation_absurde.py",
]

[tool.ruff.lint]
# Keep correctness/parse errors from pycodestyle and Pyflakes, plus a stable
# import order. Formatting remains Black's responsibility.
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.per-file-ignores]
# Package initializers intentionally order imports to preserve initialization
# dependencies and their public re-export order; alphabetizing can create
# circular imports or change optional-dependency fallbacks.
"src/graine/kernel/__init__.py" = ["I001"]
"src/graine/meta/__init__.py" = ["I001"]
"src/singular/dashboard/__init__.py" = ["I001"]
"src/singular/embodiment/__init__.py" = ["I001"]
"src/singular/events/__init__.py" = ["I001"]
"src/singular/governance/__init__.py" = ["I001"]
"src/singular/learning/__init__.py" = ["I001"]
"src/singular/memory_layers/__init__.py" = ["I001"]
"src/singular/morals/__init__.py" = ["I001"]
"src/singular/multiagent/__init__.py" = ["I001"]
"src/singular/orchestrator/__init__.py" = ["I001"]
"src/singular/providers/__init__.py" = ["I001"]
"src/singular/sensors/__init__.py" = ["I001"]
"src/singular/skills/__init__.py" = ["I001"]
"src/singular/storage/__init__.py" = ["I001"]
"src/singular/watch/__init__.py" = ["I001"]
"tests/fastapi_stub/__init__.py" = ["I001"]

[tool.mypy]
python_version = "3.10"
# The type-checking baseline is intentionally progressive.  Keep this list
# explicit so newly-clean modules can be added without globally suppressing
# concrete errors in the rest of the historical codebase.
files = [
    "src/singular/cli.py",
    "src/singular/dashboard/actions.py",
    "src/singular/diagnostics/autonomous.py",
    "src/singular/organisms/status.py",
]
follow_imports = "skip"
